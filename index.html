<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>KitDrop — Football Jerseys</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet"/>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #fafafa;
    --white: #ffffff;
    --surface: #f5f5f5;
    --border: #e8e8e8;
    --border-dark: #cccccc;
    --text: #111111;
    --text-2: #555555;
    --text-3: #999999;
    --green: #1a7a4a;
    --green-bg: #edf7f1;
    --red: #c0392b;
    --red-bg: #fdf0ee;
    --font-sans: 'DM Sans', sans-serif;
    --font-serif: 'DM Serif Display', serif;
    --r: 10px;
    --rsm: 6px;
  }
  body { background: var(--bg); color: var(--text); font-family: var(--font-sans); font-size: 15px; overflow-x: hidden; -webkit-font-smoothing: antialiased; }
  #root { min-height: 100vh; }
  * { scrollbar-width: thin; scrollbar-color: #ddd transparent; }
  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-thumb { background: #ddd; border-radius: 3px; }
  input::placeholder { color: var(--text-3); }
  button { cursor: pointer; font-family: var(--font-sans); }
  a { text-decoration: none; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script>

const CONFIG = {
  whatsappNumber: "919156165683",
  storeName: "KitDrop",
  tagline: "Authentic Football Jerseys",

// ─── JERSEYS DATA — edit this to manage inventory ────────────────────────────
const JERSEYS = [
  {
    id:"1", name:"Home Kit 2024-25", team:"Real Madrid", edition:"Home", year:"2024-25",

  },

    sizes:["M","L","XL"], originalPrice:1700, discountPercent:10, price:1530,

    description:"Manchester City's sleek away kit for the 2024-25 Premier League campaign. Premium breathable material with sky blue accents."
  },
  {

    sizes:["S","M"], originalPrice:1600, discountPercent:20, price:1280,

  },

    description:"Arsenal's iconic red home shirt for the 2024-25 Premier League season. Classic cannon crest on lightweight performance fabric."
  },
  {
    id:"5", name:"Home Kit 2023-24", team:"Brazil National", edition:"Home", year:"2023-24",
    sizes:["M","L"], originalPrice:1900, discountPercent:25, price:1425,
    inStock:false, image:null, badge:"",
    description:"Brazil's iconic yellow home jersey worn in the 2023-24 international fixtures. Classic Canarinha colourway — canary yellow and blue."
  },
  {
    id:"6", name:"Away Kit 2024-25", team:"PSG", edition:"Away", year:"2024-25",
    sizes:["S","M","L","XL","XXL"], originalPrice:2000, discountPercent:12, price:1760,
    inStock:true, image:null, badge:"Limited",
    description:"Paris Saint-Germain's stylish away kit for 2024-25. Inspired by Parisian architecture with a premium matte finish."
  },
  {
    id:"7", name:"Home Kit 2024-25", team:"Mohun Bagan", edition:"Home", year:"2024-25",
    sizes:["S","M","L","XL"], originalPrice:999, discountPercent:10, price:899,
    inStock:true, image:null, badge:"ISL",
    description:"Mohun Bagan Super Giant's home jersey for the ISL 2024-25 season. Green and maroon — the pride of Kolkata."
  },
  {
    id:"8", name:"Third Kit 2024-25", team:"Liverpool", edition:"Third", year:"2024-25",
    sizes:["M","L","XL"], originalPrice:1800, discountPercent:0, price:1800,
    inStock:true, image:null, badge:"",
    description:"Liverpool's striking third kit for 2024-25, inspired by the club's historic European nights at Anfield."
  },
];

// ─── UTILITIES ───────────────────────────────────────────────────────────────
const { useState, useEffect, useRef } = React;
const c = React.createElement;

function buildWAUrl(jersey, size) {
  const msg = `Hi! I'd like to order:\n\n🏷 *${jersey.name}*\n⚽ Team: ${jersey.team}\n📋 ${jersey.edition} Edition · ${jersey.year}\n👕 Size: ${size}\n💰 Price: ₹${jersey.price}${jersey.discountPercent > 0 ? ` (${jersey.discountPercent}% off — was ₹${jersey.originalPrice})` : ''}\n\nPlease confirm availability. Thank you!`;
  return `https://wa.me/${CONFIG.whatsappNumber}?text=${encodeURIComponent(msg)}`;
}

const ALL_TEAMS = ["All", ...Array.from(new Set(JERSEYS.map(j => j.team))).sort()];
const ALL_SIZES = ["All","S","M","L","XL","XXL"];

// ─── JERSEY SVG PLACEHOLDER ──────────────────────────────────────────────────
function JerseyArt({ team }) {
  const palettes = {
    "Real Madrid":     ["#f0f0f0","#c8a96e"],
    "Manchester City": ["#6cabdd","#1c2c5b"],
    "Barcelona":       ["#a50044","#004d98"],
    "Arsenal":         ["#ef0107","#9c824a"],
    "Brazil National": ["#009c3b","#fedf00"],
    "PSG":             ["#003370","#da291c"],
    "Mohun Bagan":     ["#1a6b3a","#7b1c35"],
    "Liverpool":       ["#c8102e","#f6eb61"],
  };
  const [c1,c2] = palettes[team] || ["#ccc","#888"];
  const initials = team.split(" ").map(w=>w[0]).join("").slice(0,3);
  const id = `g-${team.replace(/\W/g,"")}`;
  return c("svg",{viewBox:"0 0 260 320",xmlns:"http://www.w3.org/2000/svg",style:{width:"100%",height:"100%",display:"block"}},
    c("defs",null,
      c("linearGradient",{id,x1:"0",y1:"0",x2:"1",y2:"1"},
        c("stop",{offset:"0%",stopColor:c1}),
        c("stop",{offset:"100%",stopColor:c2})
      )
    ),
    c("rect",{width:"260",height:"320",fill:"#f2f2f2"}),
    c("line",{x1:"-40",y1:"0",x2:"300",y2:"320",stroke:"#e8e8e8",strokeWidth:"50"}),
    c("line",{x1:"10",y1:"0",x2:"350",y2:"320",stroke:"#e8e8e8",strokeWidth:"50"}),
    c("line",{x1:"-90",y1:"0",x2:"250",y2:"320",stroke:"#e8e8e8",strokeWidth:"50"}),
    c("path",{
      d:"M72,52 L28,94 L52,108 L48,240 L212,240 L208,108 L232,94 L188,52 L162,76 Q130,93 98,76 Z",
      fill:`url(#${id})`,opacity:"0.92"
    }),
    c("path",{
      d:"M98,76 Q130,96 162,76 L156,90 Q130,108 104,90 Z",
      fill:c2,opacity:"0.85"
    }),
    c("text",{
      x:"130",y:"168",textAnchor:"middle",dominantBaseline:"middle",
      fontSize:"54",fontWeight:"700",fontFamily:"DM Serif Display,serif",
      fill:"rgba(255,255,255,0.18)",letterSpacing:"-2"
    },initials),
    c("text",{
      x:"130",y:"284",textAnchor:"middle",
      fontSize:"9.5",fontWeight:"500",fontFamily:"DM Sans,sans-serif",
      fill:"#bbb",letterSpacing:"2.5"
    },"REPLACE WITH YOUR IMAGE")
  );
}

// ─── NAVBAR ──────────────────────────────────────────────────────────────────
function Navbar({ page, setPage }) {
  const [scrolled, setScrolled] = useState(false);
  useEffect(() => {
    const h = () => setScrolled(window.scrollY > 40);
    window.addEventListener("scroll", h);
    return () => window.removeEventListener("scroll", h);
  }, []);

  return c("nav",{
    style:{
      position:"fixed",top:0,left:0,right:0,zIndex:200,
      background: scrolled ? "rgba(255,255,255,0.97)" : "rgba(255,255,255,0.85)",
      backdropFilter:"blur(14px)",
      borderBottom:`1px solid ${scrolled ? "var(--border)" : "transparent"}`,
      transition:"border-color 0.25s,background 0.25s",
      height:"60px",display:"flex",alignItems:"center",
      padding:"0 40px",justifyContent:"space-between"
    }
  },
    c("div",{
      onClick:()=>setPage("home"),
      style:{cursor:"pointer",display:"flex",alignItems:"baseline",gap:"1px"}
    },
      c("span",{style:{fontFamily:"var(--font-serif)",fontSize:"22px",color:"var(--text)"}}, "Kit"),
      c("span",{style:{fontFamily:"var(--font-serif)",fontSize:"22px",color:"var(--text)",fontStyle:"italic"}}, "Drop")
    ),
    c("div",{style:{display:"flex",alignItems:"center",gap:"4px"}},
      ["home","about"].map(p =>
        c("button",{
          key:p,
          onClick:()=>setPage(p),
          style:{
            background:"none",border:"none",
            color: page===p ? "var(--text)" : "var(--text-2)",
            fontFamily:"var(--font-sans)",
            fontWeight: page===p ? "600" : "400",
            fontSize:"14px",padding:"8px 16px",
            borderRadius:"var(--rsm)",transition:"background 0.15s"
          },
          onMouseEnter:ev=>ev.currentTarget.style.background="var(--surface)",
          onMouseLeave:ev=>ev.currentTarget.style.background="none"
        }, p==="home" ? "Shop" : "About")
      ),
      c("a",{
        href:`https://wa.me/${CONFIG.whatsappNumber}`,target:"_blank",
        style:{
          marginLeft:"8px",background:"#25d366",color:"#fff",
          padding:"8px 18px",borderRadius:"var(--rsm)",
          fontFamily:"var(--font-sans)",fontWeight:"500",fontSize:"13px"
        }
      },"WhatsApp")
    )
  );
}

// ─── HERO ────────────────────────────────────────────────────────────────────
function Hero({ onShop }) {
  return c("div",{
    style:{
      paddingTop:"60px",background:"var(--white)",
      borderBottom:"1px solid var(--border)"
    }
  },
    c("div",{
      style:{
        maxWidth:"1160px",margin:"0 auto",
        padding:"80px 40px 0",
        display:"grid",gridTemplateColumns:"1fr 1fr",
        gap:"80px",alignItems:"center"
      }
    },
      c("div",{style:{animation:"fadeUp 0.6s ease both"}},
        c("div",{
          style:{
            display:"inline-flex",alignItems:"center",gap:"8px",
            background:"var(--green-bg)",border:"1px solid rgba(26,122,74,0.2)",
            borderRadius:"100px",padding:"5px 14px",marginBottom:"28px"
          }
        },
          c("span",{style:{width:"6px",height:"6px",background:"var(--green)",borderRadius:"50%",display:"inline-block"}}),
          c("span",{style:{fontSize:"12px",fontWeight:"500",color:"var(--green)",letterSpacing:"0.3px"}},"Free delivery on orders above ₹2000")
        ),
        c("h1",{
          style:{
            fontFamily:"var(--font-serif)",
            fontSize:"clamp(42px,5.5vw,66px)",
            lineHeight:1.08,letterSpacing:"-1.5px",
            color:"var(--text)",marginBottom:"20px"
          }
        },
          "The World's ",
          c("br"),
          c("em",null,"Best Kits"),
          c("br"),
          "Delivered."
        ),
        c("p",{
          style:{
            fontFamily:"var(--font-sans)",fontSize:"16px",
            color:"var(--text-2)",lineHeight:1.75,
            maxWidth:"400px",marginBottom:"36px"
          }
        },"Shop authentic football jerseys from clubs across Europe, South America & India. Quality checked. Delivered via WhatsApp — fast and personal."),
        c("div",{style:{display:"flex",gap:"12px",flexWrap:"wrap"}},
          c("button",{
            onClick:onShop,
            style:{
              background:"var(--text)",color:"#fff",border:"none",
              padding:"14px 32px",borderRadius:"var(--rsm)",
              fontFamily:"var(--font-sans)",fontWeight:"600",fontSize:"15px",
              letterSpacing:"0.2px",transition:"opacity 0.15s"
            },
            onMouseEnter:ev=>ev.currentTarget.style.opacity="0.82",
            onMouseLeave:ev=>ev.currentTarget.style.opacity="1"
          },"Shop All Kits →"),
          c("a",{
            href:`https://wa.me/${CONFIG.whatsappNumber}`,target:"_blank",
            style:{
              display:"inline-flex",alignItems:"center",gap:"8px",
              border:"1.5px solid var(--border)",background:"var(--white)",
              color:"var(--text)",padding:"14px 28px",borderRadius:"var(--rsm)",
              fontFamily:"var(--font-sans)",fontWeight:"500",fontSize:"15px",
              transition:"border-color 0.15s"
            }
          },"Ask on WhatsApp")
        )
      ),
      c("div",{
        style:{
          display:"grid",gridTemplateColumns:"1fr 1fr 1fr",
          gap:"12px",alignItems:"flex-end",height:"360px"
        }
      },
        [JERSEYS[0],JERSEYS[1],JERSEYS[2]].map((j,i) =>
          c("div",{
            key:j.id,
            style:{
              background:"var(--surface)",borderRadius:"var(--r)",
              overflow:"hidden",border:"1px solid var(--border)",
              height: i===1 ? "340px" : "278px",
              alignSelf:"flex-end",
              animation:`fadeUp ${0.45+i*0.13}s ease both`,
              boxShadow:"0 2px 12px rgba(0,0,0,0.04)"
            }
          }, c(JerseyArt,{team:j.team}))
        )
      )
    )
  );
}

// ─── TRUST BAR ───────────────────────────────────────────────────────────────
function TrustBar() {
  const items = [
    ["✓ Authentic jerseys","Quality checked before dispatch"],
    ["🚚 Fast shipping","Delivered to your doorstep"],
    ["💬 WhatsApp support","Personal order confirmation"],
    ["↩ Easy returns","Hassle-free return policy"],
  ];
  return c("div",{
    style:{
      background:"var(--white)",borderBottom:"1px solid var(--border)",
      padding:"20px 40px"
    }
  },
    c("div",{
      style:{
        maxWidth:"1160px",margin:"0 auto",
        display:"grid",gridTemplateColumns:"repeat(4,1fr)",
        gap:"24px"
      }
    },
      items.map(([h,s])=>
        c("div",{key:h,style:{display:"flex",alignItems:"flex-start",gap:"10px"}},
          c("div",null,
            c("p",{style:{fontFamily:"var(--font-sans)",fontWeight:"600",fontSize:"13px",color:"var(--text)",marginBottom:"2px"}},h),
            c("p",{style:{fontFamily:"var(--font-sans)",fontSize:"12px",color:"var(--text-3)"}},s)
          )
        )
      )
    )
  );
}

// ─── FILTER BAR ──────────────────────────────────────────────────────────────
function FilterBar({ filters, setFilters }) {
  return c("div",{
    style:{
      background:"var(--white)",borderBottom:"1px solid var(--border)",
      position:"sticky",top:"60px",zIndex:100
    }
  },
    c("div",{
      style:{
        maxWidth:"1160px",margin:"0 auto",
        padding:"14px 40px",
        display:"flex",flexWrap:"wrap",gap:"12px",alignItems:"center"
      }
    },
      // search
      c("div",{style:{position:"relative",flexShrink:0}},
        c("svg",{
          style:{position:"absolute",left:"11px",top:"50%",transform:"translateY(-50%)",opacity:0.35,pointerEvents:"none"},
          width:"15",height:"15",viewBox:"0 0 24 24",fill:"none",
          stroke:"currentColor",strokeWidth:"2.5",strokeLinecap:"round"
        },
          c("circle",{cx:"11",cy:"11",r:"8"}),
          c("path",{d:"m21 21-4.35-4.35"})
        ),
        c("input",{
          placeholder:"Search jerseys…",
          value:filters.search,
          onChange:ev=>setFilters(f=>({...f,search:ev.target.value})),
          style:{
            background:"var(--surface)",border:"1px solid var(--border)",
            borderRadius:"var(--rsm)",padding:"8px 14px 8px 34px",
            fontFamily:"var(--font-sans)",fontSize:"13px",
            color:"var(--text)",outline:"none",width:"200px"
          }
        })
      ),
      c("div",{style:{width:"1px",height:"22px",background:"var(--border)",flexShrink:0}}),
      // team chips
      c("div",{style:{display:"flex",gap:"5px",flexWrap:"wrap",alignItems:"center"}},
        c("span",{style:{fontSize:"11px",fontWeight:"600",color:"var(--text-3)",letterSpacing:"0.5px",textTransform:"uppercase",marginRight:"2px"}},"Team"),
        ALL_TEAMS.map(t =>
          c("button",{
            key:t,
            onClick:()=>setFilters(f=>({...f,team:t})),
            style:{
              background: filters.team===t ? "var(--text)" : "transparent",
              color: filters.team===t ? "#fff" : "var(--text-2)",
              border:`1px solid ${filters.team===t ? "var(--text)" : "var(--border)"}`,
              borderRadius:"100px",padding:"4px 13px",
              fontFamily:"var(--font-sans)",fontWeight:"500",fontSize:"12px",
              transition:"all 0.14s",whiteSpace:"nowrap"
            }
          },t)
        )
      ),
      c("div",{style:{width:"1px",height:"22px",background:"var(--border)",flexShrink:0}}),
      // size chips
      c("div",{style:{display:"flex",gap:"5px",flexWrap:"wrap",alignItems:"center"}},
        c("span",{style:{fontSize:"11px",fontWeight:"600",color:"var(--text-3)",letterSpacing:"0.5px",textTransform:"uppercase",marginRight:"2px"}},"Size"),
        ALL_SIZES.map(s =>
          c("button",{
            key:s,
            onClick:()=>setFilters(f=>({...f,size:s})),
            style:{
              background: filters.size===s ? "var(--text)" : "transparent",
              color: filters.size===s ? "#fff" : "var(--text-2)",
              border:`1px solid ${filters.size===s ? "var(--text)" : "var(--border)"}`,
              borderRadius:"var(--rsm)",padding:"4px 12px",
              fontFamily:"var(--font-sans)",fontWeight:"500",fontSize:"12px",
              transition:"all 0.14s"
            }
          },s)
        )
      ),
      // in-stock toggle
      c("label",{
        style:{
          marginLeft:"auto",display:"flex",alignItems:"center",gap:"7px",
          cursor:"pointer",fontSize:"13px",fontWeight:"500",
          color: filters.inStockOnly ? "var(--green)" : "var(--text-2)"
        }
      },
        c("input",{
          type:"checkbox",checked:filters.inStockOnly,
          onChange:ev=>setFilters(f=>({...f,inStockOnly:ev.target.checked})),
          style:{accentColor:"var(--green)",width:"14px",height:"14px"}
        }),
        "In stock only"
      )
    )
  );
}

// ─── BADGE ───────────────────────────────────────────────────────────────────
function Badge({ text }) {
  if (!text) return null;
  const map = {
    "Sale":        {bg:"#fff3e0",color:"#b85e00"},
    "New Arrival": {bg:"#e8f5e9",color:"#1a6b3a"},
    "Hot":         {bg:"#fce4ec",color:"#b71c1c"},
    "Limited":     {bg:"#ede7f6",color:"#4527a0"},
    "ISL":         {bg:"#e3f2fd",color:"#0d47a1"},
    "Out of Stock":{bg:"var(--surface)",color:"var(--text-3)"},
  };
  const s = map[text] || {bg:"var(--surface)",color:"var(--text-2)"};
  return c("span",{
    style:{
      background:s.bg,color:s.color,
      borderRadius:"4px",padding:"3px 8px",
      fontSize:"11px",fontWeight:"600",letterSpacing:"0.3px",
      display:"inline-block",flexShrink:0
    }
  },text);
}

// ─── JERSEY CARD ─────────────────────────────────────────────────────────────
function JerseyCard({ jersey, onClick }) {
  const [hov, setHov] = useState(false);
  const hasDiscount = jersey.discountPercent > 0;

  return c("div",{
    onClick:()=>onClick(jersey),
    onMouseEnter:()=>setHov(true),
    onMouseLeave:()=>setHov(false),
    style:{
      background:"var(--white)",
      border:`1px solid ${hov ? "var(--border-dark)" : "var(--border)"}`,
      borderRadius:"var(--r)",overflow:"hidden",cursor:"pointer",
      transition:"border-color 0.18s,transform 0.2s,box-shadow 0.2s",
      transform: hov ? "translateY(-4px)" : "none",
      boxShadow: hov ? "0 12px 40px rgba(0,0,0,0.09)" : "0 1px 4px rgba(0,0,0,0.04)"
    }
  },
    // image
    c("div",{style:{position:"relative",aspectRatio:"3/4",background:"var(--surface)",overflow:"hidden"}},
      c(JerseyArt,{team:jersey.team}),
      !jersey.inStock && c("div",{
        style:{
          position:"absolute",inset:0,background:"rgba(250,250,250,0.78)",
          display:"flex",alignItems:"center",justifyContent:"center"
        }
      },
        c("span",{
          style:{
            background:"var(--white)",border:"1px solid var(--border)",
            borderRadius:"var(--rsm)",padding:"8px 20px",
            fontFamily:"var(--font-sans)",fontWeight:"600",
            fontSize:"12px",color:"var(--text-2)",letterSpacing:"1.5px",
            textTransform:"uppercase"
          }
        },"Sold Out")
      ),
      hasDiscount && c("div",{
        style:{
          position:"absolute",top:"10px",left:"10px",
          background:"var(--red)",color:"#fff",
          borderRadius:"4px",padding:"3px 8px",
          fontFamily:"var(--font-sans)",fontWeight:"700",fontSize:"11px"
        }
      },`-${jersey.discountPercent}%`)
    ),
    // info
    c("div",{style:{padding:"16px"}},
      c("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:"6px",gap:"8px"}},
        c("div",null,
          c("p",{style:{fontSize:"10.5px",fontWeight:"600",color:"var(--text-3)",letterSpacing:"1px",textTransform:"uppercase",marginBottom:"3px"}},jersey.team),
          c("h3",{style:{fontFamily:"var(--font-sans)",fontWeight:"600",fontSize:"15px",color:"var(--text)",lineHeight:1.3}},jersey.name)
        ),
        jersey.badge && jersey.inStock && c(Badge,{text:jersey.badge})
      ),
      c("p",{style:{fontSize:"12px",color:"var(--text-3)",marginBottom:"12px"}}),`${jersey.edition} · ${jersey.year}`,
      // sizes
      c("div",{style:{display:"flex",gap:"4px",flexWrap:"wrap",marginBottom:"14px"}},
        jersey.sizes.map(s =>
          c("span",{key:s,style:{fontSize:"11px",fontWeight:"500",color:"var(--text-2)",background:"var(--surface)",border:"1px solid var(--border)",borderRadius:"4px",padding:"2px 7px"}},s)
        )
      ),
      // price
      c("div",{style:{display:"flex",alignItems:"baseline",gap:"8px",flexWrap:"wrap"}},
        c("span",{style:{fontFamily:"var(--font-sans)",fontWeight:"700",fontSize:"18px",color:"var(--text)"}},"₹"+jersey.price),
        hasDiscount && c("span",{style:{fontSize:"14px",color:"var(--text-3)",textDecoration:"line-through"}},"₹"+jersey.originalPrice),
        hasDiscount && c("span",{style:{fontSize:"11px",fontWeight:"600",color:"var(--green)"}}),`${jersey.discountPercent}% off`
      )
    )
  );
}

// ─── GRID ────────────────────────────────────────────────────────────────────
function JerseyGrid({ jerseys, onSelect }) {
  if (!jerseys.length) return c("div",{
    style:{textAlign:"center",padding:"80px 24px",color:"var(--text-3)",fontSize:"16px"}
  },"No jerseys match your filters.");
  return c("div",{
    style:{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(250px,1fr))",gap:"24px"}
  }, jerseys.map(j => c(JerseyCard,{key:j.id,jersey:j,onClick:onSelect})));
}

// ─── DETAIL ──────────────────────────────────────────────────────────────────
function JerseyDetail({ jersey, onBack }) {
  const [size, setSize] = useState(jersey.sizes[0]||"");
  const hasDiscount = jersey.discountPercent > 0;
  useEffect(()=>{ window.scrollTo({top:0,behavior:"smooth"}); },[]);

  return c("div",{style:{minHeight:"100vh",paddingTop:"60px",background:"var(--white)"}},
    c("div",{style:{maxWidth:"1160px",margin:"0 auto",padding:"48px 40px"}},
      // breadcrumb
      c("nav",{style:{display:"flex",alignItems:"center",gap:"8px",marginBottom:"40px"}},
        c("button",{
          onClick:onBack,
          style:{background:"none",border:"none",color:"var(--text-3)",fontFamily:"var(--font-sans)",fontSize:"13px",cursor:"pointer",padding:0}
        },"Shop"),
        c("span",{style:{color:"var(--border-dark)",fontSize:"13px"}},"›"),
        c("span",{style:{fontFamily:"var(--font-sans)",fontSize:"13px",color:"var(--text)",fontWeight:"500"}},jersey.name)
      ),
      c("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"80px",alignItems:"start"}},
        // image
        c("div",null,
          c("div",{
            style:{
              borderRadius:"var(--r)",overflow:"hidden",
              border:"1px solid var(--border)",aspectRatio:"3/4",
              background:"var(--surface)"
            }
          },c(JerseyArt,{team:jersey.team}))
        ),
        // info
        c("div",null,
          c("div",{style:{display:"flex",gap:"8px",marginBottom:"12px"}},
            jersey.badge && jersey.inStock && c(Badge,{text:jersey.badge}),
            !jersey.inStock && c(Badge,{text:"Out of Stock"})
          ),
          c("p",{style:{fontSize:"12px",fontWeight:"600",color:"var(--text-3)",letterSpacing:"1px",textTransform:"uppercase",marginBottom:"6px"}},jersey.team),
          c("h1",{
            style:{
              fontFamily:"var(--font-serif)",
              fontSize:"clamp(28px,3.5vw,42px)",
              letterSpacing:"-0.5px",lineHeight:1.1,
              color:"var(--text)",marginBottom:"6px"
            }
          },jersey.name),
          c("p",{style:{color:"var(--text-3)",fontSize:"14px",marginBottom:"28px"}}),`${jersey.edition} Edition · ${jersey.year}`,
          // price block
          c("div",{
            style:{
              background:"var(--surface)",border:"1px solid var(--border)",
              borderRadius:"var(--r)",padding:"20px 24px",marginBottom:"24px"
            }
          },
            c("div",{style:{display:"flex",alignItems:"baseline",gap:"14px",marginBottom:hasDiscount?"8px":"0"}},
              c("span",{style:{fontFamily:"var(--font-sans)",fontWeight:"700",fontSize:"34px",color:"var(--text)"}},"₹"+jersey.price),
              hasDiscount && c("span",{style:{fontSize:"20px",color:"var(--text-3)",textDecoration:"line-through"}},"₹"+jersey.originalPrice)
            ),
            hasDiscount && c("div",{style:{display:"flex",alignItems:"center",gap:"10px"}},
              c("span",{
                style:{
                  background:"var(--green-bg)",color:"var(--green)",
                  borderRadius:"4px",padding:"3px 10px",
                  fontFamily:"var(--font-sans)",fontWeight:"600",fontSize:"12px"
                }
              },`${jersey.discountPercent}% off`),
              c("span",{style:{fontSize:"13px",color:"var(--text-2)"}}),`You save ₹${jersey.originalPrice-jersey.price}`
            )
          ),
          // specs
          c("div",{
            style:{
              display:"grid",gridTemplateColumns:"1fr 1fr",gap:"1px",
              background:"var(--border)",borderRadius:"var(--r)",
              overflow:"hidden",border:"1px solid var(--border)",marginBottom:"24px"
            }
          },
            [["Team",jersey.team],["Edition",jersey.edition],["Year",jersey.year],["Stock",jersey.inStock?"In Stock ✓":"Sold Out"]].map(([k,v])=>
              c("div",{key:k,style:{background:"var(--white)",padding:"14px 16px"}},
                c("p",{style:{fontSize:"11px",fontWeight:"600",color:"var(--text-3)",letterSpacing:"0.5px",textTransform:"uppercase",marginBottom:"3px"}},k),
                c("p",{style:{fontFamily:"var(--font-sans)",fontWeight:"600",fontSize:"14px",color:k==="Stock"&&jersey.inStock?"var(--green)":"var(--text)"}}),v
              )
            )
          ),
          // size selector
          c("div",{style:{marginBottom:"24px"}},
            c("p",{style:{fontSize:"13px",fontWeight:"600",color:"var(--text)",marginBottom:"10px"}},"Select Size"),
            c("div",{style:{display:"flex",gap:"8px",flexWrap:"wrap"}},
              jersey.sizes.map(s =>
                c("button",{
                  key:s,
                  onClick:()=>setSize(s),
                  style:{
                    width:"52px",height:"44px",
                    background: size===s ? "var(--text)" : "var(--white)",
                    color: size===s ? "#fff" : "var(--text-2)",
                    border:`1.5px solid ${size===s ? "var(--text)" : "var(--border)"}`,
                    borderRadius:"var(--rsm)",
                    fontFamily:"var(--font-sans)",fontWeight:"600",fontSize:"13px",
                    transition:"all 0.14s"
                  }
                },s)
              )
            )
          ),
          // buy CTA
          c("button",{
            onClick:()=>{ if(jersey.inStock) window.open(buildWAUrl(jersey,size),"_blank"); },
            disabled:!jersey.inStock,
            style:{
              width:"100%",padding:"16px",
              background: jersey.inStock ? "#25d366" : "var(--surface)",
              color: jersey.inStock ? "#fff" : "var(--text-3)",
              border:"none",borderRadius:"var(--rsm)",
              fontFamily:"var(--font-sans)",fontWeight:"600",fontSize:"16px",
              cursor: jersey.inStock ? "pointer" : "not-allowed",
              transition:"opacity 0.15s",marginBottom:"10px"
            },
            onMouseEnter:ev=>{ if(jersey.inStock) ev.currentTarget.style.opacity="0.88"; },
            onMouseLeave:ev=>{ ev.currentTarget.style.opacity="1"; }
          },"Order on WhatsApp"),
          jersey.inStock && c("p",{style:{textAlign:"center",fontSize:"12px",color:"var(--text-3)",lineHeight:1.5}},"You'll be redirected to WhatsApp with order details pre-filled."),
          // description
          c("div",{style:{marginTop:"28px",paddingTop:"28px",borderTop:"1px solid var(--border)"}},
            c("h3",{style:{fontFamily:"var(--font-sans)",fontWeight:"600",fontSize:"14px",color:"var(--text)",marginBottom:"10px"}},"About this kit"),
            c("p",{style:{fontFamily:"var(--font-sans)",fontSize:"14px",color:"var(--text-2)",lineHeight:1.8}}),jersey.description
          )
        )
      )
    )
  );
}

// ─── ABOUT ───────────────────────────────────────────────────────────────────
function AboutPage() {
  return c("div",{style:{minHeight:"100vh",paddingTop:"60px",background:"var(--white)"}},
    c("div",{style:{maxWidth:"820px",margin:"0 auto",padding:"80px 40px"}},
      c("p",{style:{fontSize:"11px",fontWeight:"600",color:"var(--text-3)",letterSpacing:"2px",textTransform:"uppercase",marginBottom:"16px"}},"Our Story"),
      c("h1",{
        style:{
          fontFamily:"var(--font-serif)",fontSize:"clamp(36px,5vw,54px)",
          letterSpacing:"-1px",lineHeight:1.08,color:"var(--text)",marginBottom:"32px"
        }
      },"Football Jerseys,",c("br"),c("em",null,"Delivered with Care.")),
      c("div",{style:{fontFamily:"var(--font-sans)",fontSize:"16px",color:"var(--text-2)",lineHeight:1.8,display:"flex",flexDirection:"column",gap:"16px",marginBottom:"60px",paddingBottom:"60px",borderBottom:"1px solid var(--border)"}},
        c("p",null,"We're a small team of football obsessives who believe every fan deserves to wear their club's colours — no matter where they are."),
        c("p",null,"KitDrop sources authentic jerseys from clubs across La Liga, Premier League, Serie A, Ligue 1, ISL and beyond. Every kit is quality-checked before it reaches you."),
        c("p",null,"We keep it personal — order directly on WhatsApp, get a human confirmation, and have your jersey shipped to your door.")
      ),
      c("div",{style:{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:"20px",marginBottom:"60px"}},
        [["200+","Clubs stocked"],["5,000+","Orders delivered"],["4.9 ★","Customer rating"]].map(([num,label])=>
          c("div",{key:num,style:{textAlign:"center",padding:"28px 16px",background:"var(--surface)",borderRadius:"var(--r)",border:"1px solid var(--border)"}},
            c("p",{style:{fontFamily:"var(--font-serif)",fontSize:"32px",color:"var(--text)",marginBottom:"6px"}}),num,
            c("p",{style:{fontFamily:"var(--font-sans)",fontSize:"13px",color:"var(--text-3)"}}),label
          )
        )
      ),
      c("div",{style:{border:"1px solid var(--border)",borderRadius:"var(--r)",padding:"40px",textAlign:"center"}},
        c("h2",{style:{fontFamily:"var(--font-serif)",fontSize:"28px",color:"var(--text)",marginBottom:"8px"}},"Get in touch"),
        c("p",{style:{color:"var(--text-2)",fontSize:"15px",marginBottom:"24px"}},"Custom orders, wholesale inquiries, or just a question about sizing — we're on WhatsApp."),
        c("a",{
          href:`https://wa.me/${CONFIG.whatsappNumber}?text=Hi! I have a question about KitDrop.`,
          target:"_blank",
          style:{
            display:"inline-flex",alignItems:"center",gap:"10px",
            background:"#25d366",color:"#fff",
            padding:"14px 36px",borderRadius:"var(--rsm)",
            fontFamily:"var(--font-sans)",fontWeight:"600",fontSize:"15px"
          }
        },"Chat on WhatsApp")
      )
    )
  );
}

// ─── FOOTER ──────────────────────────────────────────────────────────────────
function Footer({ setPage }) {
  return c("footer",{
    style:{background:"#111",color:"rgba(255,255,255,0.5)",padding:"48px 40px",marginTop:"80px"}
  },
    c("div",{style:{maxWidth:"1160px",margin:"0 auto",display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:"24px"}},
      c("div",null,
        c("div",{style:{fontFamily:"var(--font-serif)",fontSize:"20px",color:"#fff",marginBottom:"4px"}},"KitDrop"),
        c("p",{style:{fontSize:"13px"}},"Authentic Football Jerseys")
      ),
      c("div",{style:{display:"flex",gap:"24px"}},
        ["Shop","About"].map(label =>
          c("button",{
            key:label,
            onClick:()=>setPage(label.toLowerCase()),
            style:{background:"none",border:"none",color:"rgba(255,255,255,0.45)",fontFamily:"var(--font-sans)",fontSize:"13px",cursor:"pointer",padding:0}
          },label)
        )
      ),
      c("p",{style:{fontSize:"12px"}}),`© ${new Date().getFullYear()} KitDrop`
    )
  );
}

// ─── APP ─────────────────────────────────────────────────────────────────────
function App() {
  const [page, setPage] = useState("home");
  const [selected, setSelected] = useState(null);
  const shopRef = useRef(null);
  const [filters, setFilters] = useState({search:"",team:"All",size:"All",inStockOnly:false});

  const filtered = JERSEYS.filter(j => {
    if (filters.search && !`${j.name} ${j.team} ${j.edition}`.toLowerCase().includes(filters.search.toLowerCase())) return false;
    if (filters.team!=="All" && j.team!==filters.team) return false;
    if (filters.size!=="All" && !j.sizes.includes(filters.size)) return false;
    if (filters.inStockOnly && !j.inStock) return false;
    return true;
  });

  const openDetail = jersey => { setSelected(jersey); setPage("detail"); };
  const goBack = () => {
    setSelected(null); setPage("home");
    setTimeout(()=>shopRef.current?.scrollIntoView({behavior:"smooth"}),80);
  };

  return c("div",null,
    c(Navbar,{page,setPage}),
    page==="home" && c("div",null,
      c(Hero,{onShop:()=>shopRef.current?.scrollIntoView({behavior:"smooth"})}),
      c(TrustBar),
      c("div",{ref:shopRef},c(FilterBar,{filters,setFilters})),
      c("div",{style:{maxWidth:"1160px",margin:"0 auto",padding:"48px 40px"}},
        c("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"baseline",marginBottom:"28px"}},
          c("h2",{style:{fontFamily:"var(--font-serif)",fontSize:"28px",color:"var(--text)",letterSpacing:"-0.5px"}},"All Kits"),
          c("span",{style:{fontSize:"13px",color:"var(--text-3)",fontWeight:"500"}}),`${filtered.length} items`
        ),
        c(JerseyGrid,{jerseys:filtered,onSelect:openDetail})
      ),
      c(Footer,{setPage})
    ),
    page==="detail" && selected && c("div",null,
      c(JerseyDetail,{jersey:selected,onBack:goBack}),
      c(Footer,{setPage})
    ),
    page==="about" && c("div",null,
      c(AboutPage),
      c(Footer,{setPage})
    )
  );
}

ReactDOM.render(c(App), document.getElementById("root"));
</script>
</body>
</html>
